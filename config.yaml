# =====================================================================
#  product-hunter — configuration
#  Modifiable ici ou depuis la page "Réglages". Les clés d'API ne sont
#  JAMAIS ici : elles vont dans le fichier .env.
# =====================================================================

# --------------------------------------------------------------------
# Économie unitaire : coûts pris en compte pour le profit net par commande
# --------------------------------------------------------------------
economics:
  payment_fees_pct: 3.0        # frais Shopify Payments / paiement (% du prix de vente)
  ad_cost_pct: 25.0            # coût publicitaire estimé par commande (% du prix de vente)
  target_net_margin_pct: 20.0  # marge nette visée pour calculer le prix conseillé
  price_ending: 0.90           # prix conseillé arrondi à x,90
  usd_to_eur: 0.92             # conversion des prix fournisseurs en USD (CJ)

# --------------------------------------------------------------------
# Filtres éliminatoires
# --------------------------------------------------------------------
filters:
  min_price_eur: 30            # prix de vente conseillé minimum
  max_price_eur: 80            # prix de vente conseillé maximum
  min_net_profit_eur: 5.0      # profit net minimum par commande
  max_delivery_days: 12        # délai de livraison France maximum (borne haute annoncée)
  min_supplier_rating: 4.5     # note vendeur minimum (/5)
  # Fournisseurs sans note vendeur publique (CJ est lui-même l'entrepôt) :
  # la note n'est pas exigée pour eux.
  rating_not_required_for: [cj, manuel]
  require_stock: true          # stock > 0 exigé quand la source le fournit
  max_weight_grams: 1500
  # Mots-clés (FR + EN) recherchés dans le titre, la catégorie, les tags et
  # la description (mots entiers). Chaque liste = un motif d'exclusion.
  excluded_keywords:
    batterie: [batterie, battery, rechargeable, li-ion, lithium, "usb-c rechargeable", powerbank, "power bank"]
    fragile: [verre, glass, céramique, ceramic, porcelaine, porcelain, cristal, crystal, miroir, mirror]
    electronique_complexe: [smartphone, téléphone, tablette, tablet, ordinateur, laptop, drone, caméra, camera, écouteurs, earbuds, bluetooth, wifi, "smart watch", montre connectée, projecteur, projector]
    ingere_cosmetique_sante: [complément, supplement, vitamine, vitamin, gélule, capsule, thé, tea, café, coffee, protéine, protein, crème, cream, sérum, serum, shampoing, shampoo, cosmétique, cosmetic, maquillage, makeup, parfum, perfume, huile essentielle, "essential oil", santé, health, médical, medical, orthopédique, posture corrector, correcteur de posture, masseur, massager, minceur, slimming, dentaire, teeth whitening, blanchiment]
    reglemente: [jouet, toy, bébé, baby, enfant, kids, "ce certified", laser, arme, weapon, couteau, knife, tabac, vape, cbd, alimentaire, food]
    marque_ip: [nike, adidas, apple, samsung, disney, marvel, pokemon, pokémon, "star wars", harry potter, lego, dyson, gucci, louis vuitton, chanel, rolex, nintendo, playstation, sony, barbie, "hello kitty", stanley]

# --------------------------------------------------------------------
# Score /100 (somme ramenée à 100)
# --------------------------------------------------------------------
weights:
  marge: 30
  demande: 25
  saturation: 15
  fiabilite_fournisseur: 20
  wow: 10

scoring:
  missing_data_value: 0.3      # note d'un critère dont la donnée manque (0..1)
  margin_pct_min: 5            # marge nette % -> note 0
  margin_pct_max: 30           # marge nette % -> note 1
  advertisers_ideal_min: 3
  advertisers_ideal_max: 15
  advertisers_hard_max: 50
  ad_age_target_days: 30
  saturation_max_stores: 5     # nombre de concurrents -> note 0
  delivery_days_best: 7        # délai max <= 7 j -> note délai maximale
  rating_best: 4.9
  title_similarity: 0.72       # rapprochement des imports de pubs
  cluster_similarity: 0.55     # regroupement des concurrents vendant le même produit

# --------------------------------------------------------------------
# Matching fournisseur
# --------------------------------------------------------------------
matching:
  max_products_per_run: 25     # produits envoyés aux fournisseurs par collecte
  candidates_per_supplier: 10  # résultats de recherche examinés
  details_per_supplier: 3      # meilleurs candidats dont on récupère prix exact + livraison FR
  min_match_score: 0.35        # similarité minimale titre détecté / titre fournisseur
  recheck_days: 7              # re-chercher un fournisseur après N jours
  translate_queries: true      # traduire le titre FR en requête EN via Claude (sinon mot-clé brut)

cj:
  enabled: true
  cache_hours: 24
  request_delay_s: 1.2         # CJ limite le nombre de requêtes par seconde

aliexpress:
  enabled: true
  ship_to_country: FR
  target_currency: EUR
  target_language: FR
  cache_hours: 24
  csv_folder: data/supplier_csv   # import CSV (DSers, AutoDS, export manuel…)

# --------------------------------------------------------------------
# Détection de la demande
# --------------------------------------------------------------------
http:
  timeout_s: 20
  retries: 3
  backoff_s: 2.0
  delay_between_requests_s: 1.5

shopify:
  enabled: true
  # Domaines des boutiques concurrentes (sans https://) — remplacez les exemples
  stores:
    - allbirds.com
    - gymshark.com
  max_pages: 2
  fetch_best_sellers: true
  best_sellers_only: false     # true : ne garder que les produits classés best-sellers

google_trends:
  enabled: true
  geos: [FR]
  timeframe: "today 3-m"
  max_keywords_per_run: 15
  cache_hours: 24
  delay_s: 8

ads_import:
  folder: data/ads_csv

# --------------------------------------------------------------------
# Génération IA (API Claude)
# --------------------------------------------------------------------
analyzer:
  model: claude-opus-5-5
  effort: medium
  top_n: 10
  cache_days: 30
  use_fallbacks: true

# --------------------------------------------------------------------
# Export Shopify
# --------------------------------------------------------------------
shopify_export:
  vendor: ""                   # vide = nom du fournisseur non exposé
  status: draft                # draft | active
  published: false
  inventory_qty: 100
